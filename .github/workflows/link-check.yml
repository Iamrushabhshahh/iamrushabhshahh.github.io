# Weekly broken-link sweep of the live site. Runs independently of the
# publish-blog workflow (doesn't gate deploys) — external sites blip
# transiently, so this should surface problems, not block publishing.
name: Check for broken links

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 08:30 IST
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --sitemap https://rushabhshah.dev/sitemap.xml
          fail: true
