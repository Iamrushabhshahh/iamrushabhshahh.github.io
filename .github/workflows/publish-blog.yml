# Builds the markdown blog and commits the generated HTML back to main,
# which GitHub Pages then serves. The daily cron is what makes scheduled
# publishing work: posts with a future frontmatter `date` are skipped at
# build time and picked up by the first run after that moment (up to 24h
# later).
name: Publish blog

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "style.css"
      - "index.html"
      - "linux-foundation-coupon/**"
      - "docker-captain/**"
      - "privacy/**"
      - "package.json"
      - ".github/workflows/publish-blog.yml"
  schedule:
    - cron: "40 18 * * *" # daily at 00:10 IST (18:40 UTC previous day)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: node scripts/build-blog.mjs

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml linux-foundation-coupon links privacy docker-captain index.html index.html.md
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "chore(blog): publish generated pages"
            git push
          fi
