# Builds the markdown blog and commits the generated HTML back to main,
# which GitHub Pages then serves. The daily cron is what makes scheduled
# publishing work: posts with a future frontmatter `date` are skipped at
# build time and picked up by the first run after that moment (up to 24h
# later).
name: Publish blog

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "style.css"
      - "index.html"
      - "linux-foundation-coupon/**"
      - "finops-coupon/**"
      - "coupons/**"
      - "go/**"
      - "docker-captain/**"
      - "privacy/**"
      - "package.json"
      - "next/**"
      - ".github/workflows/publish-blog.yml"
  schedule:
    - cron: "40 18 * * *" # daily at 00:10 IST (18:40 UTC previous day)
    # One-offs for the October Prime sale, so the banner flips to "live" soon
    # after the 04:00 UTC open and comes down soon after the 23:59 UTC close,
    # instead of waiting most of a day for the daily run. Safe to delete after.
    - cron: "5 4 6 10 *"
    - cron: "5 0 8 10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next/package-lock.json

      - run: npm ci

      - run: node scripts/build-blog.mjs

      # The Next routes (/speaking/, /now/, /til/, /reading/, /games/,
      # /certs/, /about/). Must run after build-blog.mjs, which writes the shared
      # header, footer and asset fingerprints to next/.chrome.json. The daily
      # cron rebuilding these is also what moves a talk from "Next up" to the
      # archive once it has happened.
      - run: npm ci --prefix next
      - run: npm run build --prefix next
      - run: node scripts/verify-url-parity.mjs

      # Only the routes listed here go live. next/ also builds
      # /contributions/, /discounts/ and /research/, which are not published
      # yet. --delete per route so a removed TIL disappears; _next/ keeps old
      # chunks so HTML still cached at the CDN can load its scripts.
      - name: Copy Next routes into the site
        run: |
          for r in speaking now til reading games certs about; do
            rsync -a --delete "next/out/$r/" "$r/"
          done
          rsync -a next/out/_next/ _next/

      # Runs on the assembled site: fails if a URL, canonical, robots value,
      # /go/ target or JSON-LD type that was live has gone missing.
      - run: node scripts/url-snapshot.mjs

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog assets/blog/thumbs sitemap.xml linux-foundation-coupon finops-coupon coupons go links privacy docker-captain index.html index.html.md
          # Next routes, plus the markdown twins and llms files, which the
          # generator rewrites on every run but were never committed, so the
          # .md copies kept advertising a sale days after it ended.
          git add speaking now til reading games certs about _next llms.txt llms-full.txt '*.md'
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "chore(blog): publish generated pages"
            git push
          fi
