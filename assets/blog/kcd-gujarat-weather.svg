<svg id="amd-weather" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="w-t w-d"><title id="w-t">The forecast for 19 September, and what Gujarat actually checks</title><desc id="w-d">Two panels. On the left, the official forecast for Saturday 19 September in Ahmedabad: a high of 33 to 34 degrees, an overnight low of 26 to 28, humidity around 71 per cent, light wind, sunrise 06:26 and sunset 18:40, with sun, cloud and passing showers. On the right, an umbrella in the rain under the name Ambalal kaka, a Gujarati weather forecaster whose rain predictions are followed closely across the state, with the advice to bring an umbrella anyway.</desc><style>
 :root{
   --paper:#f6f8fa; --ink:#1f2328; --muted:#57606a; --rule:#d0d7de;
   --cool:#0969da; --warm:#bc4c00; --panel:#ffffff;
 }
 @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
   --paper:#0d1117; --ink:#e6edf3; --muted:#8b949e; --rule:#30363d;
   --cool:#58a6ff; --warm:#e3a03c; --panel:#161b22;
 }}
 :root[data-theme="dark"]{
   --paper:#0d1117; --ink:#e6edf3; --muted:#8b949e; --rule:#30363d;
   --cool:#58a6ff; --warm:#e3a03c; --panel:#161b22;
 }
 .bg{fill:var(--paper)} .panel{fill:var(--panel)} .rule{stroke:var(--rule)}
 .eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;letter-spacing:.16em;fill:var(--muted)}
 .head{font-family:'IBM Plex Sans Condensed','Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:27px;fill:var(--ink)}
 .guj{font-family:'Noto Sans Gujarati','Shruti',system-ui,sans-serif;font-size:25px;font-weight:600;fill:var(--warm)}
 .k{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;fill:var(--muted)}
 .v{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15.5px;font-weight:600;fill:var(--ink)}
 .big{font-family:'IBM Plex Sans Condensed',system-ui,sans-serif;font-size:56px;font-weight:700;fill:var(--cool)}
 .bigw{font-family:'IBM Plex Sans Condensed',system-ui,sans-serif;font-size:34px;font-weight:700;fill:var(--warm)}
 .note{font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;fill:var(--muted)}
 .mark{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;fill:var(--muted);opacity:.7}
 .brolly{stroke:var(--warm);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
 .rain{stroke:var(--cool);stroke-width:1.8;stroke-linecap:round;opacity:.5}
 @media (prefers-reduced-motion:no-preference){
   .rain{animation:fall 1.4s linear infinite}
   @keyframes fall{from{transform:translateY(-14px)}to{transform:translateY(14px)}}
 }
</style>
<script><![CDATA[
(function(){try{var h=window.parent&&window.parent.document&&window.parent.document.documentElement;
if(!h||h===document.documentElement)return;var s=function(){var t=h.getAttribute('data-theme');
if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');};
s();new MutationObserver(s).observe(h,{attributes:true,attributeFilter:['data-theme']});}catch(e){}})();
]]></script><rect class="bg" width="1200" height="520" rx="14"/><line class="rule" x1="600" y1="54" x2="600" y2="456" stroke-width="1.2" stroke-dasharray="5 6"/><text class="eyebrow" x="56" y="72">THE FORECAST</text><text class="head" x="56" y="112">Saturday, 19 September</text><text class="big" x="56" y="196">33&#8211;34&#176;C</text><text class="k" x="56" y="226">daytime high</text><text class="k" x="56" y="272">overnight low</text><text class="v" x="230" y="272">26 to 28°C</text><text class="k" x="56" y="304">humidity</text><text class="v" x="230" y="304">around 71%</text><text class="k" x="56" y="336">wind</text><text class="v" x="230" y="336">3 to 4 m/s</text><text class="k" x="56" y="368">sunrise / sunset</text><text class="v" x="230" y="368">06:26 / 18:40</text><text class="k" x="56" y="400">conditions</text><text class="v" x="230" y="400">sun, cloud, passing showers</text><text class="note" x="56" y="436">Late monsoon. The numbers are real and</text><text class="note" x="56" y="456">they are also, locally, only advisory.</text><text class="eyebrow" x="656" y="72">WHAT GUJARAT ACTUALLY CHECKS</text><text class="guj" x="656" y="112">&#2693;&#2690;&#2732;&#2750;&#2738;&#2750;&#2738; &#2709;&#2750;&#2709;&#2750;</text><text class="head" x="656" y="146" style="font-size:19px">Ambalal kaka</text><path class="brolly" d="M808 268 a92 92 0 0 1 184 0"/><path class="brolly" d="M808 268 q23 -26 46 0 q23 -26 46 0 q23 -26 46 0 q23 -26 46 0"/><path class="brolly" d="M900 176 V354"/><path class="brolly" d="M900 354 a15 15 0 0 0 30 0"/><line class="rain" x1="750" y1="228" x2="743" y2="252" style="animation-delay:0.00s"/><line class="rain" x1="788" y1="254" x2="781" y2="278" style="animation-delay:0.19s"/><line class="rain" x1="826" y1="280" x2="819" y2="304" style="animation-delay:0.38s"/><line class="rain" x1="974" y1="228" x2="967" y2="252" style="animation-delay:0.57s"/><line class="rain" x1="1012" y1="254" x2="1005" y2="278" style="animation-delay:0.76s"/><line class="rain" x1="1050" y1="280" x2="1043" y2="304" style="animation-delay:0.95s"/><text class="bigw" x="656" y="396">Bring the umbrella.</text><text class="note" x="656" y="428">Ambalal Patel is a Gujarati weather forecaster whose rain</text><text class="note" x="656" y="448">predictions get their own news coverage. Half of Gujarat</text><text class="note" x="656" y="468">checks him before it checks the official bulletin.</text><text class="mark" x="1182" y="502" text-anchor="end">rushabhshah.dev</text></svg>